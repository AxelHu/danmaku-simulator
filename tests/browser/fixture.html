<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>网页弹幕 · 播放验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f1f2f8;font-family:"Noto Sans CJK SC",sans-serif}main{width:min(1160px,96vw);margin:34px auto}header{display:flex;align-items:baseline;gap:18px;margin-bottom:18px}h1{font-size:21px;letter-spacing:.03em;margin:0}header span{color:#94a0b7;font-size:12px}#stage{position:relative;background:#06080e;border:1px solid #2a3245;border-radius:10px;overflow:hidden;width:960px;max-width:100%;margin:auto}#stage:fullscreen{width:100vw;height:100vh;border:0;border-radius:0;display:flex;align-items:center;justify-content:center}#primary{display:block;width:100%;height:540px;object-fit:contain;background:#000}#stage:fullscreen #primary{width:100vw;height:100vh}#siteOverlay{position:absolute;bottom:36px;left:12px;color:#ddd;font-size:11px;pointer-events:none}footer{margin:18px auto;width:960px;max-width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:18px}nav{display:flex;flex-wrap:wrap;gap:9px}button{padding:9px 12px;background:#282f42;border:1px solid #424e68;border-radius:6px;color:#dce2f1;cursor:pointer}p{font-size:12px;color:#95a0b8;line-height:1.8}#secondary{width:180px;height:102px;object-fit:contain;background:#080a10;border-radius:5px}a{color:#f3a0b4}
</style>
<main>
<header><h1>网页弹幕播放预览</h1><span>Sintel · Blender Foundation · CC BY 3.0</span></header>
<section id="stage"><video id="primary" muted controls preload="auto" src="__MEDIA_URL__"></video><span id="siteOverlay">网页原有内容</span></section>
<footer><div><nav>
<button id="play">播放 / 暂停</button><button id="containerFull">容器全屏</button><button id="changeRoute">切换分集</button><button id="replaceVideo">替换播放器</button>
</nav><p>这个独立验收页面保留原生播放器与网页内容。弹幕模拟器只添加观看层。<br>此处使用真实 Sintel 预告片；分集切换按钮仅用于验证旧轨道停用。</p></div><video id="secondary" muted preload="metadata" src="__MEDIA_URL__"></video></footer>
</main>
<script>
const current=()=>document.getElementById('primary');
document.getElementById('play').onclick=()=>current().paused?current().play():current().pause();
document.getElementById('containerFull').onclick=()=>document.getElementById('stage').requestFullscreen();
document.getElementById('changeRoute').onclick=()=>history.pushState({},'', '?episode='+Date.now());
document.getElementById('replaceVideo').onclick=()=>{
 const old=current(),v=old.cloneNode(true);old.pause();old.replaceWith(v);
};
</script></html>
